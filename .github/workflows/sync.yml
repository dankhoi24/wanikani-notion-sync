name: Sync WaniKani to Notion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync.py'
      - 'n5_dashboard.py'
      - 'daily_reviews.py'
      - 'daily_lessons.py'
      - 'notion_svg_chart.py'
      - 'unlock_forecast.py'
      - 'wk_detailed.py'
      - 'guru_forecast.py'
      - 'milestone_bounds.py'
      - 'milestone_monte_carlo.py'
      - 'tests/**'
      - 'milestones.json'
      - '.github/workflows/sync.yml'
  schedule:
    # Times UTC: 07:17, 13:17, 19:17, 01:17 in Viet Nam.
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: read
concurrency:
  group: wanikani-notion-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Update the Notion dashboard
        env:
          WK_TOKEN: ${{ secrets.WK_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SNAPSHOTS_DATA_SOURCE_ID: a35d8794-a5c6-4208-ab52-b21d793bf010
          NOTION_DAILY_LESSONS_DATA_SOURCE_ID: da3a4ad9-ff3c-41eb-8733-68a4a31a1ec7
          NOTION_MILESTONES_DATA_SOURCE_ID: b45e8463-c10a-4d95-88c3-e43eaa260290
          NOTION_N5_DASHBOARD_PAGE_ID: 3fd98ffb213081b79341d760e45cdf60
          NOTION_SETTINGS_DATA_SOURCE_ID: d45e078f-eaca-4631-a908-b0a4bbb8ac07
          NOTION_LEVEL_BREAKDOWN_DATA_SOURCE_ID: d2ead7ca-8fa5-4f3a-9bcf-b20a9096cb98
          NOTION_REVIEW_CHECKPOINTS_DATA_SOURCE_ID: c5a70422-4fc0-4d8f-95e7-296f448f9e8a
        run: python sync.py
